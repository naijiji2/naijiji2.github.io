<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>维护中 · NAIJIJI的博客</title>
  <style>
    :root {
      --bg: #0f1115;
      --text: #e8e6e3;
      --muted: #9a9690;
      --line: rgba(232, 230, 227, 0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background:
        radial-gradient(ellipse at 20% 10%, rgba(99, 102, 241, 0.18), transparent 45%),
        radial-gradient(ellipse at 80% 90%, rgba(167, 139, 250, 0.12), transparent 40%),
        var(--bg);
      color: var(--text);
      font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
    }
    main {
      width: min(36rem, 100%);
      text-align: center;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      padding: 3rem 1.25rem;
    }
    .brand {
      letter-spacing: 0.28em;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 1.5rem;
      text-indent: 0.28em;
    }
    h1 {
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      font-weight: 500;
      letter-spacing: 0.12em;
      margin-bottom: 1rem;
    }
    p {
      color: var(--muted);
      line-height: 1.9;
      font-size: 0.98rem;
    }
    .motto {
      margin-top: 2rem;
      font-size: 0.85rem;
      letter-spacing: 0.18em;
      color: rgba(232, 230, 227, 0.55);
    }
  </style>
</head>
<body>
  <main>
    <p class="brand">NAIJIJI的博客</p>
    <h1>维护中</h1>
    <p>站点暂时下线整修，稍后回来。<br />文章与内容仍在，只是暂不对外展示。</p>
    <p class="motto">你思故我在</p>
  </main>
</body>
</html>
